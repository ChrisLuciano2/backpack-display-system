# Backpack Gaming Hub: RetroArch settings for a handed-around console.
#
# The installer copies this to ~/.config/backpack/retroarch.cfg, and game-mode.service
# runs RetroArch with it. It is never overwritten once it exists, so you can edit it.
# Every key here comes from general knowledge of RetroArch, not from testing on your
# Pi. RetroArch ignores keys it does not know, so a wrong name is harmless but does
# nothing. Lines marked CHECK are the ones to verify first (Phase 0 runbook, step 9).

# ── Screen and menu ─────────────────────────────────────────────────────────
video_fullscreen = "true"
# The Ozone menu can be driven by a controller. CHECK: "xmb" or "rgui" also work.
menu_driver = "ozone"

# ── Where things live (the server and the installer use these folders) ──────
system_directory = "~/bios"
savefile_directory = "~/saves"
savestate_directory = "~/states"
rgui_browser_directory = "~/roms"
content_directory = "~/roms"

# ── Guests: never lose progress ─────────────────────────────────────────────
savestate_auto_save = "true"
savestate_auto_load = "true"

# ── Guests: keep them out of the settings and out of "quit" ─────────────────
# Kiosk mode hides the Settings menu. CHECK that it really is hidden.
kiosk_mode_enable = "true"
# These hide the menu entries that would end or restart the console.
menu_show_quit_retroarch = "false"
menu_show_restart_retroarch = "false"
menu_show_shutdown = "false"
menu_show_reboot = "false"
menu_show_configurations = "false"
quit_press_twice = "false"
confirm_on_exit = "false"
# No controller button combination should be able to close RetroArch itself.
input_quit_gamepad_combo = "0"
# Leaving a game: press the controller's centre (Home or Guide) button, then choose
# "Close Content". The printed card says this. CHECK that the Home button opens the menu.

# ── Phone control (the server talks to RetroArch here, localhost only) ──────
network_cmd_enable = "true"
network_cmd_port = "55355"
network_cmd_address = "127.0.0.1"

# ── Controllers ─────────────────────────────────────────────────────────────
input_autodetect_enable = "true"
input_joypad_driver = "udev"
# Pause the game if a controller disconnects mid game. CHECK the exact name.
pause_nonactive = "false"

# ── Show a message when a controller connects or leaves ─────────────────────
notification_show_autoconfig = "true"
