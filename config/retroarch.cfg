# Backpack Gaming Hub: RetroArch settings for a console that gets handed around.
#
# The installer copies this to ~/.config/backpack/retroarch.cfg, and game-mode.service
# runs RetroArch with it. RetroArch fills in every other option with its defaults the
# first time it runs, so the real file on the Pi is longer than this one. This file only
# holds what we change on purpose. The option names were checked against RetroArch 1.20
# on the Pi (2026-10-05). Whether each one has the effect we want is noted below.

# ── Screen and menu ─────────────────────────────────────────────────────────
video_fullscreen = "true"
# RGUI is plain text and needs no icon pack. The fancier Ozone menu shows black boxes
# for icons unless RetroArch's asset pack is installed.
menu_driver = "rgui"

# ── Where things live (the server and the installer use these folders) ──────
system_directory = "~/bios"
savefile_directory = "~/saves"
savestate_directory = "~/states"
rgui_browser_directory = "~/roms"
content_directory = "~/roms"

# ── Guests: never lose progress ─────────────────────────────────────────────
savestate_auto_save = "true"
savestate_auto_load = "true"

# ── Guests: keep them out of the settings and out of "quit" ─────────────────
# Tested on the Pi: with kiosk mode on, the main menu loses Settings, Quit, Restart.
kiosk_mode_enable = "true"
menu_show_quit_retroarch = "false"
menu_show_restart_retroarch = "false"
menu_show_shutdown = "false"
menu_show_reboot = "false"
menu_show_configurations = "false"
quit_press_twice = "false"
confirm_on_exit = "false"
input_quit_gamepad_combo = "0"

# ── Main menu: one clear path (Load Content, pick a game) ───────────────────
content_show_settings = "false"
content_show_favorites = "false"
content_show_history = "false"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_explore = "false"
content_show_add = "false"
content_show_playlists = "true"
content_show_contentless_cores = "3"
desktop_menu_enable = "false"
menu_show_load_core = "false"
# Guests pick from the game lists below. "Load Content" would let them browse the Pi's folders.
menu_show_load_content = "false"
menu_show_load_disc = "false"
menu_show_dump_disc = "false"
menu_show_information = "false"
menu_show_help = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"

# ── In-game pause menu (press the controller's Home button): keep it short ──
# Leave a game: Home, then "Close Content".
quick_menu_show_resume_content = "true"
quick_menu_show_restart_content = "true"
quick_menu_show_close_content = "true"
quick_menu_show_save_load_state = "true"
quick_menu_show_savestate_submenu = "true"
quick_menu_show_undo_save_load_state = "true"
quick_menu_show_cheats = "false"
quick_menu_show_options = "false"
quick_menu_show_controls = "false"
quick_menu_show_shaders = "false"
quick_menu_show_start_recording = "false"
quick_menu_show_start_streaming = "false"
quick_menu_show_take_screenshot = "false"
quick_menu_show_add_to_favorites = "false"
quick_menu_show_reset_core_association = "false"
quick_menu_show_set_core_association = "false"
quick_menu_show_save_content_dir_overrides = "false"
quick_menu_show_save_core_overrides = "false"
quick_menu_show_save_game_overrides = "false"
quick_menu_show_information = "false"
quick_menu_show_download_thumbnails = "false"

# ── Phone control (the server talks to RetroArch here, localhost only) ──────
network_cmd_enable = "true"
network_cmd_port = "55355"
network_cmd_address = "127.0.0.1"

# ── Controllers ─────────────────────────────────────────────────────────────
input_autodetect_enable = "true"
input_joypad_driver = "udev"
notification_show_autoconfig = "true"
